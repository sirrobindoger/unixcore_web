# Ergo IRC server for unixcore.sh. Trimmed from Ergo 2.19's default.yaml; anything
# not listed here takes Ergo's built-in default. The full annotated reference is
# `ergo defaultconfig`.
#
# Paths are relative to the working directory: /var/lib/ergo on the VPS
# (see infra/ergo.service), data/ergo under scripts/dev.sh.

network:
    name: unixcore

server:
    name: unixcore.sh
    listeners:
        # Plaintext, loopback only: the Discord bridge in the bot connects here.
        "127.0.0.1:6667":
        "[::1]:6667":
        # Public, TLS only. Two certs picked by SNI: unixcore.sh (also the default for
        # clients that send no SNI) and irc.unixcore.sh. On the VPS both are Caddy's,
        # copied in by scripts/ergo-certs.sh; locally scripts/dev.sh makes self-signed ones.
        ":6697":
            tls-certificates:
                -
                    cert: tls/fullchain.pem
                    key: tls/privkey.pem
                -
                    cert: tls/irc-fullchain.pem
                    key: tls/irc-privkey.pem
            min-tls-version: 1.2
    casemapping: "ascii"
    enforce-utf8: true
    lookup-hostnames: false
    check-ident: false
    coerce-ident: '~u'
    motd: ergo.motd
    motd-formatting: true
    # RELAYMSG lets the bridge post as "name/d" instead of "<name> text" from one nick.
    # The bridge's account founds the channel, which makes it a chanop.
    relaymsg:
        enabled: true
        separators: "/"
        available-to-chanops: true
    max-sendq: 96k
    compatibility:
        force-trailing: true
        send-unprefixed-sasl: true
    ip-limits:
        count: true
        max-concurrent-connections: 8
        throttle: true
        window: 10m
        max-connections-per-window: 16
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        exempted:
            - "localhost"
    ip-cloaking:
        enabled: true
        enabled-for-always-on: true
        netname: "unixcore"
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        num-bits: 64

accounts:
    authentication-enabled: true
    registration:
        enabled: true
        allow-before-connect: true
        throttling:
            enabled: true
            duration: 10m
            max-attempts: 30
        bcrypt-cost: 4
        email-verification:
            enabled: false
    login-throttling:
        enabled: true
        duration: 1m
        max-attempts: 3
    login-via-pass-command: true
    advertise-scram: true
    require-sasl:
        enabled: false
    nick-reservation:
        enabled: true
        method: strict
        guest-nickname-format: "Guest-*"
        force-nick-equals-account: true
    multiclient:
        enabled: true
        allowed-by-default: true
        always-on: "opt-in"
        auto-away: "opt-in"
    vhosts:
        enabled: false
    default-user-modes: +i

channels:
    default-modes: +ntC
    max-channels-per-client: 100
    registration:
        enabled: true
        max-channels-per-account: 15

# No IRC operators yet. To add one: `ergo genpasswd`, then an `opers:` block as in
# `ergo defaultconfig`, then `systemctl reload ergo`.
oper-classes:
    "server-admin":
        title: Server Admin
        capabilities: ["kill", "ban", "nofakelag", "relaymsg", "sajoin", "samode", "snomasks",
            "rehash", "accreg", "chanreg", "history", "defcon", "massmessage"]

logging:
    -
        method: stderr
        type: "* -userinput -useroutput"
        level: info

debug:
    recover-from-errors: true

lock-file: "ircd.lock"

datastore:
    path: ircd.db
    autoupgrade: true

languages:
    enabled: false

limits:
    nicklen: 32
    identlen: 20
    realnamelen: 150
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    monitor-entries: 100
    whowas-entries: 100
    chan-list-modes: 100
    registration-messages: 1024
    multiline:
        max-bytes: 4096
        max-lines: 100

fakelag:
    enabled: true
    window: 1s
    burst-limit: 5
    messages-per-window: 2
    cooldown: 2s

# In-memory scrollback (lost on restart), served to clients that ask for it.
history:
    enabled: true
    channel-length: 2048
    client-length: 256
    autoresize-window: 3d
    autoreplay-on-join: 0
    chathistory-maxmessages: 1000
    znc-maxmessages: 2048
    restrictions:
        expire-time: 1w
        query-cutoff: 'none'
        grace-period: 1h
    persistent:
        enabled: false

allow-environment-overrides: true
