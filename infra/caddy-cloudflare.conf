# systemd drop-in for caddy.service, installed by scripts/deploy.sh to
# /etc/systemd/system/caddy.service.d/cloudflare.conf.
# /etc/caddy/cloudflare.env (server only, 640 root:caddy) holds CF_API_TOKEN: a
# Cloudflare user token "unixcore caddy DNS-01 (irc cert)" with Zone Read + DNS
# Write on unixcore.sh only, usable only from the droplet's IP. Caddy uses it to
# renew irc.unixcore.sh by DNS-01.
[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
