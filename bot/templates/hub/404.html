<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - unixcore.sh</title>
<!-- Served by Caddy's handle_errors for any missing path (infra/Caddyfile), so every URL here is absolute. -->
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; }
	body {
		min-height: 100vh; min-height: 100svh;
		display: flex; align-items: center; justify-content: center;
		padding: 48px 16px;
		background: #000 url("/_hub/tile.png");
		color: #fff;
		font: 15px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	}

	.box {
		max-width: 100%;
		display: flex; flex-direction: column; align-items: center;
		padding: 40px 56px 48px;
		background: #2a0a2a url("/_hub/velvet.png");
		border: 2px solid #000;
		box-shadow: 0 0 0 1px #6a2a6a, 8px 8px 0 #000;
	}

	h1 {
		display: flex; align-items: flex-end; gap: 0.12em;
		margin: 0 0 8px;
		font: bold clamp(56px, 14vw, 128px)/1 Verdana, Tahoma, "DejaVu Sans", sans-serif;
		letter-spacing: -0.04em;
		text-shadow: 0.04em 0.04em 0 #000;
	}
	h1 img { height: 1.1em; width: auto; margin-bottom: -0.06em; }

	p {
		margin: 0 0 28px;
		font: bold 16px/1.3 Verdana, Tahoma, "DejaVu Sans", sans-serif;
		color: #e8d8e8;
		text-shadow: 1px 1px 0 #000;
	}

	.btn {
		display: inline-flex; align-items: center;
		height: 42px; padding: 0 18px;
		background: linear-gradient(#e6e6e6, #c0c0c0 45%, #a8a8a8);
		color: #000;
		border: 2px solid; border-color: #fff #404040 #404040 #fff;
		box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf, 2px 2px 0 #000;
		font: bold 14px/1 Verdana, Tahoma, "DejaVu Sans", sans-serif; letter-spacing: -0.02em;
		text-shadow: 1px 1px 0 #fff;
		text-decoration: none;
	}
	.btn:hover { background: linear-gradient(#f2f2f2, #cfcfcf 45%, #b4b4b4); }
	.btn:active {
		background: linear-gradient(#a8a8a8, #c0c0c0 55%, #d4d4d4);
		border-color: #404040 #fff #fff #404040;
		box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
		transform: translate(2px, 2px);
	}
	.btn:focus-visible { outline: 2px dotted #fff; outline-offset: 3px; }

	@media (max-width: 600px) {
		body { padding: 32px 12px; }
		.box { padding: 28px 20px 32px; box-shadow: 0 0 0 1px #6a2a6a, 5px 5px 0 #000; }
	}
</style>
</head>
<body>

<div class="box">
	<h1>404<img src="/_hub/asya.png" width="386" height="259" alt=""></h1>
	<p>not found</p>
	<a class="btn" href="/">&larr; unixcore.sh</a>
</div>

</body>
</html>
