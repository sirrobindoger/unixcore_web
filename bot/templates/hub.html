<html>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style type="text/css">
	/* the scattered junk behind the panel -- one <img> per file in bot/templates/hub/bg/ */
	.bg img { position: fixed; z-index: 0; image-rendering: pixelated; }
	.bg img:nth-child(8n+1) { left: 4%;   top: 6%;  }
	.bg img:nth-child(8n+2) { right: 5%;  top: 12%; }
	.bg img:nth-child(8n+3) { left: 8%;   bottom: 14%; }
	.bg img:nth-child(8n+4) { right: 7%;  bottom: 8%; }
	.bg img:nth-child(8n+5) { left: 22%;  top: 44%; }
	.bg img:nth-child(8n+6) { right: 20%; top: 60%; }
	.bg img:nth-child(8n+7) { left: 40%;  top: 3%;  }
	.bg img:nth-child(8n+8) { right: 38%; bottom: 3%; }
	table { position: relative; z-index: 1; }
</style>
</head>
<body bgcolor="#000000" background="/_hub/tile.png" text="#c0c0c0" link="#66ff99" vlink="#33aa66" alink="#ffffff">

{{decor}}
</div>

<br><br>
